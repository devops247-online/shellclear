# GoReleaser configuration. Run locally without publishing:
#   goreleaser release --snapshot --clean
version: 2

project_name: shellclear

before:
  hooks:
    - go mod verify

builds:
  - id: shellclear
    main: ./cmd/shellclear
    binary: shellclear
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

nfpms:
  - id: packages
    package_name: shellclear
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: devops247-online
    homepage: https://github.com/devops247-online/shellclear
    maintainer: devops247-online <noreply@github.com>
    description: Find secrets in shell history and remove them without breaking the history file.
    license: Apache-2.0
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/shellclear/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/shellclear/NOTICE
      - src: README.md
        dst: /usr/share/doc/shellclear/README.md

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^chore(\(.+\))?:'

release:
  github:
    owner: devops247-online
    name: shellclear
  prerelease: auto
  footer: |
    ## Install

    ```sh
    brew install devops247-online/tap/shellclear
    go install github.com/devops247-online/shellclear/cmd/shellclear@{{ .Tag }}
    ```

    Verify a downloaded archive:

    ```sh
    gh attestation verify shellclear_{{ .Version }}_<os>_<arch>.tar.gz -R devops247-online/shellclear
    ```
