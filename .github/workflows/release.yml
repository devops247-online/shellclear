name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  security:
    # The blocking checks must pass before anything is built.
    name: security (${{ matrix.check }})
    strategy:
      matrix:
        check: [modverify, govulncheck, grype, trivy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: ${{ matrix.check }}
        run: scripts/security-scan.sh ${{ matrix.check }}

  goreleaser:
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign build provenance
      attestations: write  # store build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: test before releasing
        run: go test -race ./...
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  homebrew:
    needs: goreleaser
    # Stable releases only; tags such as v0.2.0-rc.1 are skipped.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: check the tap token
        id: token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the Homebrew tap is not updated."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
      - name: render the formula
        if: steps.token.outputs.present == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL --retry 5 "$url" -o source.tar.gz
          sha=$(sha256sum source.tar.gz | cut -d' ' -f1)
          sed -e "s|@URL@|$url|" -e "s|@SHA256@|$sha|" packaging/homebrew/shellclear.rb.tmpl > shellclear.rb
          ruby -c shellclear.rb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          repository: devops247-online/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: publish the formula
        if: steps.token.outputs.present == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p tap/Formula
          cp shellclear.rb tap/Formula/shellclear.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/shellclear.rb
          if git diff --cached --quiet; then
            echo "formula unchanged"
            exit 0
          fi
          git commit -m "shellclear ${TAG}"
          git push
