name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.22.x", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: coverage of internal packages is at least 80%
        shell: bash
        run: |
          go test -coverprofile=internal.out ./internal/... > /dev/null
          total=$(go tool cover -func=internal.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "internal coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t >= 80) ? 0 : 1 }'
      - name: build
        run: go build -trimpath -o /dev/null ./cmd/shellclear

  coverage-badge:
    # Publishes the total coverage to the "badges" branch on every push to
    # main; README.md reads it through a shields.io endpoint badge.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push to the badges branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: measure coverage
        id: cov
        run: |
          go test -coverprofile=cover.out ./... > /dev/null
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          color=$(awk -v p="$pct" 'BEGIN { print (p >= 90) ? "brightgreen" : (p >= 80) ? "green" : (p >= 70) ? "yellow" : "red" }')
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "color=$color" >> "$GITHUB_OUTPUT"
          echo "coverage: ${pct}% (${color})"
      - name: publish the badge
        env:
          PCT: ${{ steps.cov.outputs.pct }}
          COLOR: ${{ steps.cov.outputs.color }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges >/dev/null; then
            git fetch --depth 1 origin badges
            git worktree add ../badges FETCH_HEAD
            git -C ../badges switch -c badges
          else
            git worktree add --orphan -b badges ../badges
          fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" > ../badges/coverage.json
          cd ../badges
          git add coverage.json
          if git diff --cached --quiet; then
            echo "coverage unchanged"
            exit 0
          fi
          git commit -m "coverage ${PCT}% for ${GITHUB_SHA::7}"
          git push origin badges

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  fuzz:
    name: fuzz (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzZshParse, FuzzBashParse, FuzzFishParse, FuzzPowerShellParse, FuzzShellWriters]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: fuzz for 30 seconds
        run: go test ./internal/history/ -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 30s
      - name: keep failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          path: internal/history/testdata/fuzz

  security:
    # One job per scanner so they run in parallel; see scripts/security-scan.sh.
    # Gates: modverify, govulncheck, grype, trivy. Informational: osv, capslock.
    name: security (${{ matrix.check }})
    strategy:
      fail-fast: false
      matrix:
        check: [modverify, govulncheck, grype, trivy, osv, capslock]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: ${{ matrix.check }}
        run: scripts/security-scan.sh ${{ matrix.check }}

  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: render the Homebrew formula
        run: |
          sed -e "s|@URL@|https://example.invalid/shellclear.tar.gz|" -e "s|@SHA256@|$(printf '0%.0s' {1..64})|" \
            packaging/homebrew/shellclear.rb.tmpl > shellclear.rb
          ruby -c shellclear.rb
