# Ported from rusty-ferris-club/shellclear tests/suites_sensitive_patterns (Apache-2.0).
# Changed: the original value contained "EXAMPLE", which shellclear treats as a
# placeholder. The value was replaced with a non-placeholder of the same length.
- name: detect AWS_SECRET_ACCESS_KEY environment variable
  test: AWS_SECRET_ACCESS_KEY=AKISHELLCLEARTESTK3Y
  expected: AKISHELLCLEARTESTK3Y
- name: detect AWS_SECRET_ACCESS_KEY environment variable with space
  test: AWS_SECRET_ACCESS_KEY=AKISHELLCLEARTESTK3Y AAA
  expected: AKISHELLCLEARTESTK3Y