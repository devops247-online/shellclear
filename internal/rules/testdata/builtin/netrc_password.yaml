# Rule tests. "{{c*n}}" expands to c repeated n times; expected "" means no match.

- name: "printf with literal newlines"
  test: "printf 'machine x.atlassian.net\\n  login me@corp.com\\n  password S3cretPass\\n' >> ~/.netrc"
  expected: "S3cretPass"

- name: "one line"
  test: "echo machine api.heroku.com login me password S3cretPass >> ~/.netrc"
  expected: "S3cretPass"

- name: "real newlines"
  test: "cat >> ~/.netrc <<EOF\nmachine example.org\nlogin me\npassword S3cretPass\nEOF"
  expected: "S3cretPass"

- name: "default entry"
  test: "echo 'default login anonymous password S3cretPass' > ~/.netrc"
  expected: "S3cretPass"

- name: "variable"
  test: "echo \"machine h login u password $PASS\" >> ~/.netrc"
  expected: ""

- name: "no password"
  test: "docker-machine ls"
  expected: ""
