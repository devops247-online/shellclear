# Rule tests. "{{c*n}}" expands to c repeated n times; expected "" means no match.

- name: "batch create"
  test: "htpasswd -bc .htpasswd admin S3cretPass"
  expected: "S3cretPass"

- name: "batch to stdout"
  test: "htpasswd -nb admin S3cretPass"
  expected: "S3cretPass"

- name: "interactive"
  test: "htpasswd -c .htpasswd admin"
  expected: ""
