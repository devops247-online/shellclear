# Rule tests. "{{c*n}}" expands to c repeated n times; expected "" means no match.

- name: "quoted"
  test: "sshpass -p 'S3cret!' ssh user@host"
  expected: "S3cret!"

- name: "attached"
  test: "sshpass -pS3cretPass ssh host"
  expected: "S3cretPass"

- name: "password file and ssh port"
  test: "sshpass -f ~/.pw ssh -p 2222 host"
  expected: ""
