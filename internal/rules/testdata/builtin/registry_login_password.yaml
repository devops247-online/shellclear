# Rule tests. "{{c*n}}" expands to c repeated n times; expected "" means no match.

- name: "docker -p"
  test: "docker login -u me -p hunter2hunter2 registry.example.org"
  expected: "hunter2hunter2"

- name: "podman --password="
  test: "podman login --password=S3cretPass quay.io"
  expected: "S3cretPass"

- name: "password-stdin"
  test: "docker login -u me --password-stdin"
  expected: ""

- name: "variable"
  test: "docker login -u me -p $PASS"
  expected: ""
