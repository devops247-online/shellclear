# Rule tests. "{{c*n}}" expands to c repeated n times; expected "" means no match.

- name: "password with ="
  test: "mytool --password=S3cretPass"
  expected: "S3cretPass"

- name: "api key with space"
  test: "app --api-key {{k*32}}"
  expected: "{{k*32}}"

- name: "kubectl token"
  test: "kubectl --token={{t*40}} get pods"
  expected: "{{t*40}}"

- name: "client secret"
  test: "az login --service-principal -u app --client-secret Abc123Def456 --tenant t"
  expected: "Abc123Def456"

- name: "password-stdin"
  test: "docker login --password-stdin"
  expected: ""

- name: "placeholder"
  test: "app --password=<pass>"
  expected: ""

- name: "variable"
  test: "app --password $PASS"
  expected: ""

- name: "already masked"
  test: "app --password=********"
  expected: ""

- name: "redacted"
  test: "app --password=[REDACTED:cli_password_flag]"
  expected: ""

- name: "token file"
  test: "app --token-file ./t"
  expected: ""
