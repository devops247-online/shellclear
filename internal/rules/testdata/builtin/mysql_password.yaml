# Rule tests. "{{c*n}}" expands to c repeated n times; expected "" means no match.

- name: "mysql"
  test: "mysql -uroot -pSup3rS3cret db"
  expected: "Sup3rS3cret"

- name: "mysqldump"
  test: "mysqldump -h db -u admin -pS3cret db > dump.sql"
  expected: "S3cret"

- name: "prompt"
  test: "mysql -uroot -p db"
  expected: ""

- name: "port"
  test: "mysql -uroot -P3306 db"
  expected: ""
