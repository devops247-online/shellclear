# Rule tests. "{{c*n}}" expands to c repeated n times; expected "" means no match.

- name: "export password"
  test: "export DB_PASSWORD=S3cretPass"
  expected: "S3cretPass"

- name: "pgpassword"
  test: "PGPASSWORD=S3cret psql -h db"
  expected: "S3cret"

- name: "mysql_pwd"
  test: "MYSQL_PWD=S3cret mysql"
  expected: "S3cret"

- name: "terraform var"
  test: "terraform apply -var client_secret=Abc123Def456"
  expected: "Abc123Def456"

- name: "powershell env"
  test: "$env:MY_API_KEY = \"abc123def456\""
  expected: "abc123def456"

- name: "variable"
  test: "export TOKEN=$VAR"
  expected: ""

- name: "braced variable"
  test: "export API_KEY=${API_KEY}"
  expected: ""

- name: "token file path"
  test: "export TOKEN_FILE=/tmp/t"
  expected: ""

- name: "already masked"
  test: "export API_KEY=******"
  expected: ""

- name: "placeholder"
  test: "export API_KEY=your_api_key"
  expected: ""

- name: "example value"
  test: "export AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMIK7MDENG/bPxRfiCYEXAMPLEKEY"
  expected: ""
